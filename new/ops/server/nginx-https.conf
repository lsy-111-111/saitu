server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name gzhanchuang.com www.gzhanchuang.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/saitu-acme; }
    location / { return 308 https://gzhanchuang.com$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name www.gzhanchuang.com;
    ssl_certificate /etc/letsencrypt/live/gzhanchuang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gzhanchuang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://gzhanchuang.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name gzhanchuang.com;
    ssl_certificate /etc/letsencrypt/live/gzhanchuang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gzhanchuang.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 128k;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location ^~ /api/health/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3190;
        proxy_http_version 1.1;
        proxy_set_header Host gzhanchuang.com;
        proxy_set_header X-Forwarded-Host gzhanchuang.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }
}
